name: Release

# Runs when a version tag is pushed (for example v1.3.1). The tag must match package.json.
# 1. Tests and the export-surface check must pass.
# 2. Publishes to npm unless that version is already on the registry
#    (needs NPM_TOKEN with direct-publish permission).
# 3. Waits for the version, latest tag, and downloadable tarball on the public registry.
# 4. Creates the GitHub release from the matching CHANGELOG.md section
#    unless a release for the tag already exists.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write

# Do not overlap retries for the same tag while npm processes a publication.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild protobufjs
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then echo "::error::tag v$TAG does not match package.json $PKG"; exit 1; fi
      - run: npm test
      - run: npm run check
      - name: Publish to npm (skipped if this version already exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — skipping"; exit 0; fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set — cannot publish $NAME@$VERSION"; exit 1; fi
          npm publish --access public --provenance --tag latest
      - name: Wait for npm version, latest tag and tarball
        timeout-minutes: 17
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { setTimeout as delay } from 'node:timers/promises';
          const { name, version } = JSON.parse(await readFile('package.json', 'utf8'));
          const deadline = Date.now() + 15 * 60 * 1_000;
          let last = 'not checked';
          while (Date.now() < deadline) {
            try {
              // Query the public registry directly instead of relying on an npm cache.
              const url = `https://registry.npmjs.org/${encodeURIComponent(name)}?verify=${Date.now()}`;
              const res = await fetch(url, {
                headers: { 'cache-control': 'no-cache', accept: 'application/vnd.npm.install-v1+json' },
                signal: AbortSignal.timeout(10_000),
              });
              if (!res.ok) {
                last = `HTTP ${res.status}`;
              } else {
                const metadata = await res.json();
                const published = metadata.versions?.[version];
                const available = published?.version === version;
                const latest = metadata['dist-tags']?.latest;
                last = `version available: ${available}; latest: ${latest ?? '(none)'}`;
                if (available && latest === version) {
                  // A packument can become visible before the tarball is downloadable.
                  const tarball = new URL(published.dist?.tarball);
                  if (tarball.protocol !== 'https:' || tarball.hostname !== 'registry.npmjs.org' || tarball.username || tarball.password) {
                    throw new Error('unexpected tarball URL');
                  }
                  const download = await fetch(tarball, {
                    headers: { 'cache-control': 'no-cache' },
                    signal: AbortSignal.timeout(30_000),
                  });
                  if (download.status === 200 && download.body) {
                    const hash = createHash('sha512');
                    for await (const chunk of download.body) hash.update(chunk);
                    const digest = `sha512-${hash.digest('base64')}`;
                    if (published.dist.integrity?.split(/\s+/).includes(digest)) {
                      console.log(`Registry verified: ${name}@${version} is latest; tarball integrity matches.`);
                      process.exit(0);
                    }
                    last = 'metadata ready, tarball integrity mismatch';
                  } else {
                    if (download.body) await download.body.cancel();
                    last = `metadata ready, tarball HTTP ${download.status}`;
                  }
                }
              }
            } catch (error) {
              last = `registry request failed: ${error.name}`;
            }
            console.log(`Waiting for registry: ${last}`);
            await delay(Math.min(15_000, Math.max(0, deadline - Date.now())));
          }
          console.error(`::error::Registry verification timed out (${last}). Check npm before retrying publication.`);
          process.exitCode = 1;
          NODE
      - name: GitHub release from CHANGELOG.md (skipped if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — skipping"; exit 0; fi
          node .github/release-notes.mjs "$GITHUB_REF_NAME" > /tmp/release-notes.md
          cat /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "WhatsBibz ${GITHUB_REF_NAME#v}" --notes-file /tmp/release-notes.md --latest
