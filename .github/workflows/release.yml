name: Release

# Publishes to npm when a version tag is pushed (v1.3.1). The tag must match package.json.
# Requires the repository secret NPM_TOKEN (an npm "Automation" token).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild protobufjs
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then echo "tag v$TAG != package.json $PKG"; exit 1; fi
      - run: npm test
      - run: npm run check
      - name: Publish (skipped if this version already exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "already published — skipping"; exit 0; fi
          npm publish --access public --provenance
      - name: GitHub release from CHANGELOG
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          body_path: .github/release-notes.md
        if: ${{ hashFiles('.github/release-notes.md') != '' }}
