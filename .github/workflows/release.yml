name: Release

# Runs when a version tag is pushed (for example v1.3.1). The tag must match package.json.
# 1. Tests and the export-surface check must pass.
# 2. Publishes to npm unless that version is already on the registry
#    (needs the repository secret NPM_TOKEN — an npm "Automation" token).
# 3. Creates the GitHub release from the matching CHANGELOG.md section
#    unless a release for the tag already exists.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild protobufjs
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then echo "::error::tag v$TAG does not match package.json $PKG"; exit 1; fi
      - run: npm test
      - run: npm run check
      - name: Publish to npm (skipped if this version already exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — skipping"; exit 0; fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set — cannot publish $NAME@$VERSION"; exit 1; fi
          npm publish --access public --provenance
      - name: GitHub release from CHANGELOG.md (skipped if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — skipping"; exit 0; fi
          node .github/release-notes.mjs "$GITHUB_REF_NAME" > /tmp/release-notes.md
          cat /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "WhatsBibz ${GITHUB_REF_NAME#v}" --notes-file /tmp/release-notes.md --latest
