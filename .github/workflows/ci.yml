name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20.18.1', 20, 22, 24, 26]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild protobufjs
      - name: Offline tests
        run: npm test
      - name: Export surface
        run: npm run check

  sound-sticker:
    name: Sound-sticker conversion and audio integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild protobufjs
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Require real FFmpeg, WebP and Opus integration tests
        env:
          REQUIRE_FFMPEG: '1'
        run: node --test test/sound-sticker-ffmpeg.test.js test/sound-sticker-protocol.test.js test/media-upload-content-length.test.js test/message-recipes-routing.test.js

  voip-offline:
    name: Offline VoIP, FFmpeg, native WebRTC and WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild protobufjs
      - name: Install the optional native WebRTC peer
        # npm 11 may skip an existing optional peer with --no-save. Saving a
        # pinned dev entry in this ephemeral checkout ensures it is installed;
        # the lockfile is not changed and package scripts remain disabled.
        run: npm install --save-dev --save-exact --package-lock=false --ignore-scripts --no-audit --no-fund @roamhq/wrtc@0.10.0
      - name: Install and verify FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && ffmpeg -version
      - name: Exercise offline call lifecycle and real local transports
        env:
          REQUIRE_WRTC: '1'
          REQUIRE_VOIP_WASM: '1'
        run: node --test --test-concurrency=2 test/voip-audio-feeder.test.js test/voip-lifecycle.test.js test/voip-relay.test.js test/voip-webrtc-native.test.js test/voip-wasm-smoke.test.js

  optional-peers:
    name: Optional peer adapters and safe redirect handling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.18.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild protobufjs
      - name: Install FFmpeg for the optional legacy video preview
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Jimp, legacy audio, patched link preview and QR peers
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund jimp@1.7.0 audio-decode@2.2.3 link-preview-js@4.0.4 qrcode-terminal@0.12.0
      - name: Exercise legacy fallbacks without Sharp
        env:
          REQUIRE_OPTIONAL_PEERS: legacy
        run: node --test test/optional-peers.test.js
      - name: Add Sharp and maintained audio decoder
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund jimp@1.7.0 audio-decode@2.2.3 link-preview-js@4.0.4 qrcode-terminal@0.12.0 sharp@0.35.5 @audio/decode@4.4.0 fluent-ffmpeg@2.1.3
      - name: Exercise modern peers
        env:
          REQUIRE_OPTIONAL_PEERS: modern
        run: node --test test/optional-peers.test.js

  types:
    name: TypeScript declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild protobufjs
      - name: Compile API regression fixtures
        run: npm run test:types
      - name: Compile a strict consumer against the shipped .d.ts
        run: |
          mkdir -p /tmp/tscheck
          cat > /tmp/tscheck/consumer.ts <<'TS'
          import makeWASocket, { createBibzWhats, Browsers, resolveDeviceIdentity, BIBZWHATS_PACKAGE, proto,
            type BibzWhatsClient, type ResolvedIdentity } from '@xbibzlibrary/whatsbibz';
          async function main(): Promise<void> {
            const client: BibzWhatsClient = await createBibzWhats({ phone: '1', identity: 'archLinux:Chrome' });
            client.on('identity-changed', (i) => { const n: string = i.linkedDeviceName; void n; });
            const r: ResolvedIdentity = resolveDeviceIdentity({ browser: Browsers.whatsbibz('Chrome') });
            const m = proto.Message.create({ conversation: BIBZWHATS_PACKAGE }); void m; void r;
            const sock = makeWASocket({ auth: client.sock!.authState }); void sock; client.close();
          }
          void main;
          TS
          cat > /tmp/tscheck/tsconfig.json <<JSON
          { "compilerOptions": { "strict": true, "module": "NodeNext", "moduleResolution": "NodeNext", "target": "ES2022",
              "noEmit": true, "skipLibCheck": false, "types": ["node"], "typeRoots": ["$PWD/node_modules/@types"],
              "paths": { "@xbibzlibrary/whatsbibz": ["$PWD/lib/index.d.ts"] } },
            "files": ["consumer.ts"] }
          JSON
          npx tsc -p /tmp/tscheck/tsconfig.json

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pack and inspect
        run: |
          npm pack --json > pack.json
          node -e '
            const [p] = require("./pack.json");
            const names = p.files.map(f => f.path);
            const forbidden = names.filter(n => /^(test|example|scripts)\//.test(n) || /(^|\/)(bibzwhats-session|example-session)(\/|$)|(^|\/)(creds|identity)\.json$|\.npmrc$|-tmp\.mjs$/.test(n));
            const required = ["lib/index.js","lib/index.d.ts","lib/Utils/sound-sticker.js","lib/Utils/sound-sticker.d.ts","lib/VoIP/index.js","lib/VoIP/index.d.ts","lib/VoIP/worker-bootstrap.js","lib/assets/wasm/whatsapp.wasm","lib/assets/wasm/worker-modules.js","WAProto/index.js","WAProto/index.d.ts","README.md","README.id.md","CHANGELOG.md","LICENSE","LICENSE.upstream","assets/logo/preview.png"];
            const missing = required.filter(r => !names.includes(r));
            console.log(`${p.entryCount} files, ${(p.size/1e6).toFixed(1)} MB packed`);
            if (forbidden.length) { console.error("forbidden files in tarball:", forbidden); process.exit(1); }
            if (missing.length) { console.error("missing files in tarball:", missing); process.exit(1); }
          '
      - name: Install the tarball in an empty project and import it
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          printf '{"name":"consumer","private":true,"type":"module"}' > package.json
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/xbibzlibrary-whatsbibz-*.tgz
          node --input-type=module -e "import { createBibzWhats, BIBZWHATS_VERSION, proto } from '@xbibzlibrary/whatsbibz'; console.log('ok', BIBZWHATS_VERSION, typeof createBibzWhats, Object.keys(proto).length, 'proto namespaces')"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
